services:
  db:
    image: postgres:16-alpine
    container_name: ccp-investment-db
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: ccp
      POSTGRES_PASSWORD: ccp
      POSTGRES_DB: ccpinvestment
    volumes:
      - ccp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccp -d ccpinvestment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ccp_pg_data:
